[package]
name = "relay"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "noti-relay"
path = "src/main.rs"

[dependencies]
proto = { path = "../proto" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
http-body-util = "0.1"
store = { path = "../store" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
