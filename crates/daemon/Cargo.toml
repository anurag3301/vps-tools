[package]
name = "daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "noti-daemon"
path = "src/main.rs"

[dependencies]
proto = { path = "../proto" }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
qrcode = { version = "0.14", default-features = false }
